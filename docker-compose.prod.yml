# CityPulse — ISOLATED production stack (api + db + cache).
#
# Deploy (isolated docker compose project, never collides with other projects):
#   docker compose -p citypulse -f docker-compose.prod.yml up -d --build
#
# Isolation guarantees:
#   * compose project name forced to "citypulse" (-p citypulse) -> own network "citypulse_default"
#   * all container names prefixed citypulse-*
#   * postgres & redis are INTERNAL ONLY (no host port published) -> cannot clash with anything
#   * api is published on host port 13096 (a high, unused port) -> 13096 -> container 3096
#   * the dedicated volume is citypulse_pgdata (does not touch finmozg_* / any other volume)
#
# The frontend "web" service was intentionally removed: the frontend is deployed
# separately (Vercel) and its build context (../citypulse) does not exist on the VPS.

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: citypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citypulse
      POSTGRES_USER: citypulse
      POSTGRES_PASSWORD: citypulse2026
    security_opt:
      - no-new-privileges:true
    # No host port published — reachable only inside citypulse_default as "postgres:5432".
    expose:
      - "5432"
    volumes:
      - citypulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citypulse -d citypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: citypulse-redis
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /data
    # No host port published — reachable only inside citypulse_default as "redis:6379".
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citypulse-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # ReportsService writes generated PDF/XLSX reports under /app/artifacts on boot.
    # With a read-only root filesystem that path must be a writable mount.
    volumes:
      - citypulse_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Production configuration comes from the .env file (see /opt/citypulse-api/.env).
    # env_file values are the source of truth; the inline values below are only a
    # fallback so the service still boots if .env is ever missing.
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://citypulse:citypulse2026@postgres:5432/citypulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3096"
      NODE_ENV: production
    # Publish ONLY the api, on an isolated high host port (13096) that is free on the VPS.
    # A reverse proxy (Caddy) can also reach it in-network at http://citypulse-api:3096.
    ports:
      - "13096:3096"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3096/api/v1/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  citypulse_pgdata:
  citypulse_artifacts:
