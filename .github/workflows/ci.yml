name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Cheap service containers so the build/tests have a DB + cache available.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: citypulse
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: citypulse2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://citypulse:citypulse2026@localhost:5432/citypulse
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci-test-secret
      PORT: "3096"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --passWithNoTests
