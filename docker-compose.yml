version: '3.9'
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: citypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citypulse
      POSTGRES_USER: citypulse
      POSTGRES_PASSWORD: citypulse2026
    ports:
      - "5453:5432"
    volumes:
      - citypulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citypulse -d citypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: citypulse-redis
    restart: unless-stopped
    ports:
      - "6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  citypulse_pgdata:
